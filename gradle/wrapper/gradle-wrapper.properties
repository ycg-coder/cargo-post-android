distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 8.14.6（2026-10-09 升级，原 8.9）：AGP 8.13 要求 Gradle ≥ 8.13，见根 build.gradle.kts 的注释。
#
# ⚠ 为什么走腾讯镜像而不是官方地址：
#   本机实测 `services.gradle.org` 会 302 到 downloads.gradle-dn.com，而该域名在此网络下
#   连接被拒（ConnectException: Connection refused），wrapper 直接下不动发行包。
#   腾讯镜像实测 HTTP 200 且完整可取。这与 settings.gradle.kts 里已配的 aliyun 仓库是同一考量
#   ——本工程本就按国内网络环境分发依赖。
#   海外/CI 环境如需官方源，把下一行换回：
#     https\://services.gradle.org/distributions/gradle-8.14.6-bin.zip
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.6-bin.zip
networkTimeout=10000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# 工程路径含非 ASCII 字符（用户名），需要该项放行 AGP 的路径检查
android.overridePathCheck=true
# ⚠ 仅 Windows + 非 ASCII 工程路径需要注意（本仓库就在这个条件下）：
#   Gradle 守护进程写 worker 的 @argfile 用 file.encoding，JDK 的 Windows 启动器却按系统 ANSI 代码页解码，
#   "袁/Desktop/测试" 被按 GBK 读歪后测试 worker 直接 ClassNotFoundException（表现为 GradleWorkerMain 找不到）。
#   这里保持 UTF-8（Linux/CI 的正确值）。本机跑单元测试请临时覆盖，不要改默认值：
#     ./gradlew -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=GBK" :app:testDebugUnitTest

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
